<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Produtos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main>
    <h1>Produtos</h1>

    <!-- Formulário de cadastro/edição de produto -->
    <section>
      <h2>Novo produto</h2>
      <form id="productForm">
        <!-- Campo escondido: guarda o id do produto quando estamos EDITANDO. -->
        <input type="hidden" id="productId" name="productId" />

        <label for="productName">Nome</label>
        <input type="text" id="productName" name="name" required />

        <label for="productSalePrice">Preço de venda (R$)</label>
        <input type="number" id="productSalePrice" name="sale_price" step="0.01" min="0" required />

        <label for="productCategory">Categoria</label>
        <input type="text" id="productCategory" name="category" />

        <!-- O estoque inicial só é pedido ao CRIAR um produto novo.
             Ao editar, este campo fica escondido — reposição de estoque
             é feita por uma ação separada, direto na lista de produtos. -->
        <div id="initialStockField">
          <label for="productInitialStock">Estoque inicial (unidades prontas)</label>
          <input type="number" id="productInitialStock" name="stock_quantity" step="1" min="0" value="0" />
        </div>

        <div class="button-row">
          <button type="submit">Salvar</button>
          <button type="button" id="cancelEditButton" hidden>Cancelar edição</button>
        </div>
      </form>

      <p id="formMessage"></p>
    </section>

    <!-- Lista de produtos já cadastrados -->
    <section>
      <h2>Produtos cadastrados</h2>
      <table id="productTable">
        <thead>
          <tr>
            <th>Nome</th>
            <th>Categoria</th>
            <th>Preço</th>
            <th>Estoque</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="productTableBody">
          <!-- As linhas de produto serão inseridas aqui via JavaScript -->
        </tbody>
      </table>
    </section>
  </main>

  <script type="module" src="js/pages/products.js"></script>
</body>
</html>
